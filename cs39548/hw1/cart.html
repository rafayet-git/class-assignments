<!DOCTYPE html>

                <li><a href="index.html" class="hover:text-yellow-400 block py-2">Home</a></li>
                <li><a href="menu.html" class="hover:text-yellow-400 block py-2">Menu</a></li>
                <li><a href="about.html" class="hover:text-yellow-400 block py-2">About</a></li>
                <li><a href="contact.html" class="hover:text-yellow-400 block py-2">Contact</a></li>
                <li>
                    <a href="cart.html" class="hover:text-yellow-400 block py-2 flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                        </svg>
                        Cart
                    </a>
                </li>
            </ul>
            <button id="menu-btn" class="md:hidden block focus:outline-none ml-4" aria-label="Open Menu">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </nav>
    </header>
    
    <main class="flex-1">
        <div id="cart-items"></div>
        
    </main>

    <footer class="bg-red-900 text-white mt-12 px-4 py-6">
        <div class="flex flex-col md:flex-row md:justify-between items-center gap-4">  
            <div class="flex items-center gap-4">
                <span>Follow us:</span>
                <a href="https://www.facebook.com/RestaurantBusiness/" target="_blank" class="hover:text-yellow-400 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current bi bi-facebook" viewBox="0 0 16 16">

                </svg>
                Facebook
                </a>
                <a href="https://www.instagram.com/top_nyc_restaurants/?hl=en" target="_blank" class="hover:text-yellow-400 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg"  class="w-5 h-5 fill-current bi bi-instagram" viewBox="0 0 24 24">

                    </svg>
                    Instagram
                </a>
            </div>
            <div>
                <p class="text-sm">Business Hours: <span class="font-semibold">Mon-Friday: 10 AM - 12 PM</span></p>
            </div>
        </div>
        <div class="text-center text-xs mt-4 opacity-70">
            &copy; 2025 Rafayet Hossain
        </div>
    </footer>
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navLinks = document.getElementById('nav-links');
        menuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('hidden');
        });
    </script>
    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="flex items-center justify-center min-h-[40vh]">
                        <p class="text-center text-lg font-bold text-white">Your cart is empty.</p>
                    </div>
                    <div class="flex items-center justify-center min-h-[1vh]">
                        <a href="menu.html" class="text-center text-lg text-yellow-400 underline hover:text-yellow-500">Order food at the menu here.</a>
                    </div>
                `;
                return;
            }
            let html = `
                <div class="max-w-2xl mx-auto mt-8 bg-white rounded-lg shadow-lg p-8">
                    <h2 class="text-2xl font-bold mb-6 text-red-900 text-center">Your Cart</h2>
                    <div class="space-y-4">
            `;
            let total = 0;
            cart.forEach((item, idx) => {
                html += `
                    <div class="flex items-center justify-between bg-red-200 rounded-lg shadow p-4">
                        <div>
                            <span class="font-semibold text-lg">${item.name}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-bold text-red-900">$${((item.price || 0.00)).toFixed(2)}</span>
                            <button class="delete-item bg-red-500 hover:bg-red-700 text-white px-3 py-1 rounded" data-idx="${idx}">Delete</button>
                        </div>
                    </div>
                `;
                total += (item.price || 0);
            });
            html += `
                    </div>
                    <div class="mt-6 text-right text-xl text-red-900 font-bold">
                        Total: <span class="text-yellow-700">$${total.toFixed(2)}</span>
                        <button id="clear-cart" class="bg-red-700 hover:bg-red-900 text-white px-4 py-2 rounded">
                            Clear Cart
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML = html;

            document.querySelectorAll('.delete-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    cart.splice(idx, 1);
                    localStorage.setItem('cart', JSON.stringify(cart));
                    renderCart();
                });
            });
            document.getElementById('clear-cart').onclick = function() {
                localStorage.removeItem('cart');
                renderCart();
            };
        }
        renderCart();
    </script>
</body>
</html>
